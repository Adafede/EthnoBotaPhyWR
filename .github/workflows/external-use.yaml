---
name: External Use
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: null
permissions: read-all
jobs:
  ethnobotaphywr-test:
    name: ethnobotaphywr-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          needs: check

      - name: Install from local source
        run: install.packages(".", repos = NULL, type = "source")
        shell: Rscript {0}

      - name: Verify installed package
        run: |
          library(EthnoBotaPhyWR)
          stopifnot(
            is.function(ethnobotafever_tree),
            identical(class(orchids_compounds), "data.frame"),
            nrow(orchids_compounds) > 0L,
            identical(class(orchids_compound_classes), "data.frame"),
            nrow(orchids_compound_classes) > 0L,
            identical(class(orchids_ethnobotanical), "data.frame"),
            nrow(orchids_ethnobotanical) > 0L,
            nzchar(system.file("extdata", "itol", "Orchidaceae_phyto_species_tree.tre", package = "EthnoBotaPhyWR"))
          )
        shell: Rscript {0}
